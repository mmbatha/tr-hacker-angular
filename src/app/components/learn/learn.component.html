<h2>Learning</h2>
<h3>About AG-Grid</h3>
<div class="content" style="width: 100%; height: 100%;">
  <!-- The AG Grid component, with Dimensions, CSS Theme, Row Data, and Column Definition -->
  <ag-grid-angular style="width: 100%; height: 100%;" [rowData]="rowData" [columnDefs]="colDefs"
    [defaultColDef]="defaultColDef" [pagination]="true" [rowSelection]="rowSelection" (gridReady)="onGridReady($event)"
    (cellValueChanged)="onCellValueChanged($event)" (selectionChanged)="onSelectionChanged($event)" />
</div>
<h3>About Menu tabs</h3>
<div style="padding: 20px;">
  <button (click)="load('SN001')">View SN001</button>
  <button (click)="load('SN002')">View SN002</button>
  @if (selectedSerial$ | async; as serial) {
  <div style="margin-top: 20px;">
    <h3>Unit: {{ serial }}</h3>

    @if (isLoading$(serial) | async) {
    <div>
      <p>⏳ Loading tabs specifically for {{ serial }}...</p>
    </div>
    } @else {
    <ul>
      @for (tab of tabs$ | async; track tab.tabId) {
      <li>{{ tab.displayName }}</li>
      }
    </ul>
    }
  </div>
  }
</div>
